name: AniList Status Monitor

permissions:
  contents: read
  actions: read

concurrency:
  group: anilist-monitor
  cancel-in-progress: true

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # LOAD PREVIOUS STATE
      # ==========================================
      - name: Download previous state
        shell: bash
        run: |
          set -e

          mkdir -p ./state

          echo "Looking for previous state artifact..."

          ARTIFACT_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=anilist-monitor-state&per_page=10")

          ARTIFACT_URL=$(echo "$ARTIFACT_JSON" | jq -r '
            [.artifacts[]
              | select(.expired == false)
              | sort_by(.created_at)
            ]
            | last
            | .archive_download_url // empty
          ')

          if [ -z "$ARTIFACT_URL" ]; then
            echo "No previous state found."
          else
            echo "Previous state found."

            curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "$ARTIFACT_URL" \
              -o ./state/state.zip

            unzip -o ./state/state.zip -d ./state/
            rm ./state/state.zip

            if [ -f "./state/anilist_status.json" ]; then
              echo "Loaded state:"
              cat ./state/anilist_status.json
            fi
          fi


      # ==========================================
      # CHECK ANILIST
      # ==========================================
      - name: Check AniList
        id: check
        shell: bash
        run: |
          set -o pipefail

          STATUS="up"
          ERROR_MSG=""

          HTTP_CODE=$(curl -sS \
            --max-time 20 \
            -o /tmp/anilist_body.json \
            -w "%{http_code}" \
            -X POST "https://graphql.anilist.co/" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"query":"{ Media(id:1) { id } }"}' \
            || echo "000")

          echo "HTTP Code: $HTTP_CODE"

          RAW_MSG=$(jq -r \
            '.errors[0].message // ""' \
            /tmp/anilist_body.json 2>/dev/null || true)

          echo "AniList response:"
          cat /tmp/anilist_body.json || true

          if [ "$HTTP_CODE" != "200" ] || [ -n "$RAW_MSG" ]; then
            STATUS="down"

            if [ -n "$RAW_MSG" ]; then
              ERROR_MSG="$RAW_MSG"
            else
              ERROR_MSG="HTTP status code $HTTP_CODE"
            fi
          fi

          ERROR_MSG=$(echo "$ERROR_MSG" | tr '\n' ' ' | cut -c1-900)

          echo "STATUS=$STATUS" >> "$GITHUB_OUTPUT"
          echo "STATUS_CODE=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "ERROR_MSG=$ERROR_MSG" >> "$GITHUB_OUTPUT"

          echo ""
          echo "================================"
          echo "AniList Status: $STATUS"
          echo "HTTP Code: $HTTP_CODE"
          echo "Error: $ERROR_MSG"
          echo "================================"


      # ==========================================
      # LOAD PREVIOUS STATE
      # ==========================================
      - name: Load Previous State
        id: prev
        shell: bash
        run: |
          if [ -f "./state/anilist_status.json" ]; then

            PREV_STATUS=$(jq -r '.status // "unknown"' \
              ./state/anilist_status.json)

            DOWN_SINCE=$(jq -r '.down_since // ""' \
              ./state/anilist_status.json)

          else

            PREV_STATUS="unknown"
            DOWN_SINCE=""

          fi

          echo "PREV_STATUS=$PREV_STATUS" >> "$GITHUB_OUTPUT"
          echo "DOWN_SINCE=$DOWN_SINCE" >> "$GITHUB_OUTPUT"

          echo "Previous status: $PREV_STATUS"
          echo "Previous down_since: $DOWN_SINCE"


      # ==========================================
      # SEND DOWN NOTIFICATION
      # ==========================================
      - name: Notify Down
        if: steps.check.outputs.STATUS == 'down' && steps.prev.outputs.PREV_STATUS != 'down'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROLE_ID: "1541150515293982792"
        shell: bash
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          PAYLOAD=$(jq -nc \
            --arg role "$ROLE_ID" \
            --arg error "${{ steps.check.outputs.ERROR_MSG }}" \
            --arg code "${{ steps.check.outputs.STATUS_CODE }}" \
            --arg ts "$TS" \
            '{
              content: (if $role != "" then "<@&\($role)>" else null end),
              embeds: [{
                title: "🔴 AniList is DOWN",
                description: "**Error:** \($error)\n**Status Code:** \($code)",
                color: 16729156,
                footer: {
                  text: "AniList Monitor"
                },
                timestamp: $ts
              }]
            }')

          RESPONSE=$(curl -sS \
            -o /tmp/webhook_response.txt \
            -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST \
            "$WEBHOOK_URL?wait=true" \
            -d "$PAYLOAD")

          echo "Discord webhook HTTP: $RESPONSE"

          if [ "$RESPONSE" -lt 200 ] || [ "$RESPONSE" -ge 300 ]; then
            echo "Discord webhook failed:"
            cat /tmp/webhook_response.txt
            exit 1
          fi


      # ==========================================
      # SEND UP NOTIFICATION
      # ==========================================
      - name: Notify Up
        if: steps.check.outputs.STATUS == 'up' && steps.prev.outputs.PREV_STATUS == 'down'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          DOWN_SINCE="${{ steps.prev.outputs.DOWN_SINCE }}"
          NOW=$(date +%s)

          if [ -n "$DOWN_SINCE" ] && [ "$DOWN_SINCE" != "null" ]; then

            DURATION_SEC=$((NOW - DOWN_SINCE))

            HRS=$((DURATION_SEC / 3600))
            MINS=$(((DURATION_SEC % 3600) / 60))
            SECS=$((DURATION_SEC % 60))

            if [ "$HRS" -gt 0 ]; then
              DURATION_STR="${HRS}h ${MINS}m ${SECS}s"
            else
              DURATION_STR="${MINS}m ${SECS}s"
            fi

          else
            DURATION_STR="Unknown"
          fi

          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          PAYLOAD=$(jq -nc \
            --arg duration "$DURATION_STR" \
            --arg ts "$TS" \
            '{
              embeds: [{
                title: "🟢 AniList is back UP",
                description: "**Downtime Duration:** \($duration)",
                color: 4521096,
                footer: {
                  text: "AniList Monitor"
                },
                timestamp: $ts
              }]
            }')

          RESPONSE=$(curl -sS \
            -o /tmp/webhook_response.txt \
            -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST \
            "$WEBHOOK_URL?wait=true" \
            -d "$PAYLOAD")

          echo "Discord webhook HTTP: $RESPONSE"

          if [ "$RESPONSE" -lt 200 ] || [ "$RESPONSE" -ge 300 ]; then
            echo "Discord webhook failed:"
            cat /tmp/webhook_response.txt
            exit 1
          fi


      # ==========================================
      # SAVE STATE
      # ==========================================
      - name: Save State
        shell: bash
        run: |
          mkdir -p ./state

          STATUS="${{ steps.check.outputs.STATUS }}"
          PREV_STATUS="${{ steps.prev.outputs.PREV_STATUS }}"
          DOWN_SINCE="${{ steps.prev.outputs.DOWN_SINCE }}"

          NOW=$(date +%s)

          if [ "$STATUS" = "down" ] && [ "$PREV_STATUS" != "down" ]; then
            DOWN_SINCE="$NOW"

          elif [ "$STATUS" = "up" ]; then
            DOWN_SINCE=""
          fi

          jq -nc \
            --arg status "$STATUS" \
            --arg down_since "$DOWN_SINCE" \
            '{
              status: $status,
              down_since: (
                if $down_since != ""
                then ($down_since | tonumber)
                else null
                end
              )
            }' \
            > ./state/anilist_status.json

          echo "Saved state:"
          cat ./state/anilist_status.json


      # ==========================================
      # UPLOAD STATE
      # ==========================================
      - name: Upload State Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anilist-monitor-state
          path: ./state/anilist_status.json
          retention-days: 1
          overwrite: true